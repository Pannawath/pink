    .tab-btn {

      gap: 6px;
      padding: 11px 16px;

      background: transparent;
      color: #334155 !important;
      font-family: inherit;

    }

    .tab-btn.active {

      color: #be185d !important;

    .tab-count-pill {

      font-weight: 700;
      background: #f1f5f9 !important;
      border: 1px solid #e2e8f0 !important;

    }

    /* Main Container */

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi-card {
      padding: 16px;
      border: 1px solid #e2e8f0 !important;
      background: #ffffff !important;
    }

    .kpi-label {
      font-size: 12px;
      color: #64748b !important;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a !important;
      letter-spacing: -0.5px;
    }

    .kpi-sub {
      margin-top: 4px;
      font-size: 11px;
      color: #64748b !important;
    }

    /* Meter Cards */
    .meter-card {
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid #e2e8f0 !important;
      background: #ffffff !important;
    }

    .meter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .meter-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #0f172a !important;
    }

    .meter-badge {
      font-size: 11px;
      padding: 2px 6px;
      font-weight: 700;
      border: 1px solid;
    }

    .meter-badge.full {
      background: #fef2f2 !important;
      color: #b91c1c !important;
      border-color: #fecaca !important;
    }

    .meter-badge.open {
      background: #ecfdf5 !important;
      color: #047857 !important;
      border-color: #a7f3d0 !important;
    }

    .meter-bar-track {
      width: 100%;
      height: 8px;
      background: #f1f5f9 !important;
      border: 1px solid #e2e8f0 !important;
      margin-bottom: 6px;
    }

    .meter-bar-fill {
      height: 100%;
    }

    /* Duplicates */
    .dupe-card {
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #e2e8f0 !important;
      border-left: 4px solid #b45309 !important;
      background: #ffffff !important;

    .dupe-header {

      margin-bottom: 10px;

      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .dupe-role-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #f1f5f9 !important;
      border: 1px solid #e2e8f0 !important;

    /* Settings */
    .settings-section {
      padding: 16px 20px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0 !important;
      background: #ffffff !important;

    .settings-section-title {

    .setting-row {

      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0 !important;

    .setting-row:last-child {

    }

    .setting-info h4 {
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 2px;
      color: #0f172a !important;
    }

    .setting-info p {
      font-size: 11.5px;
      color: #64748b !important;
    }

    /* Switch (Sharp Flat) */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1 !important;
      border: 1px solid #94a3b8 !important;
      transition: .15s ease;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff !important;
      transition: .15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    input:checked + .slider {
      background-color: #047857 !important;
      border-color: #059669 !important;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Table Style */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #e2e8f0 !important;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;

    .btn {

      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;

    .pin-inputs {

      font-weight: 700;
      text-align: center;

    .pin-digit:focus {

    /* Modals */
    .modal-overlay {
