<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>อยุธยาสีชมพู 2569 · ศูนย์ควบคุมผู้ดูแลระบบ (Admin)</title>
  
  <link rel="icon" type="image/png" href="../assets/images/school_crest.png">
  <link rel="apple-touch-icon" href="../assets/images/school_crest.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Prompt:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --admin-bg: #f8fafc;
      --admin-surface: #ffffff;
      --admin-surface-alt: #f1f5f9;
      --admin-border: #e2e8f0;
      --admin-border-dark: #cbd5e1;

      --admin-text-main: #0f172a;
      --admin-text-secondary: #334155;
      --admin-text-muted: #64748b;

      --admin-primary: #be185d;
      --admin-primary-hover: #9d174d;
      --admin-primary-light: #fdf2f8;
      --admin-primary-border: #fbcfe8;

      --admin-accent: #047857;
      --admin-accent-light: #ecfdf5;
      --admin-warning: #b45309;
      --admin-warning-light: #fffbeb;
      --admin-danger: #b91c1c;
      --admin-danger-light: #fef2f2;

      --admin-font: 'Prompt', 'Kanit', -apple-system, BlinkMacSystemFont, sans-serif;
      --bottom-bar-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important; /* Sharp corners */
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: #f8fafc !important;
      background-color: #f8fafc !important;
      background-image: none !important;
      color: #0f172a !important;
      font-family: var(--admin-font);
      min-height: 100vh;
      line-height: 1.5;
      font-size: 14px;
    }

    body {
      padding-bottom: calc(var(--bottom-bar-height) + 16px);
    }

    /* Top App Bar */
    .mobile-app-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff !important;
      border-bottom: 2px solid #e2e8f0 !important;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-logo-badge {
      width: 34px;
      height: 34px;
      background: var(--admin-primary);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-title-wrap h1 {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--admin-text-main);
      line-height: 1.2;
    }

    .app-title-wrap p {
      font-size: 11px;
      color: var(--admin-text-muted);
      line-height: 1.2;
    }

    .app-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-action-btn {
      width: 36px;
      height: 36px;
      background: #ffffff;
      border: 1px solid var(--admin-border-dark);
      color: var(--admin-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-action-btn:hover {
      background: var(--admin-surface-alt);
      color: var(--admin-text-main);
    }

    /* Drawer Sidebar Menu (Inspired by Mobile Template) */
    .drawer-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 200;
      display: none;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .drawer-sidebar {
      position: fixed;
      top: 0; left: -280px; bottom: 0;
      width: 280px;
      background: #ffffff;
      border-right: 2px solid var(--admin-border);
      z-index: 210;
      display: flex;
      flex-direction: column;
      transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .drawer-sidebar.open {
      left: 0;
    }

    .drawer-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--admin-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--admin-surface-alt);
    }

    .drawer-nav-list {
      padding: 12px 0;
      flex: 1;
      overflow-y: auto;
    }

    .drawer-category {
      font-size: 11px;
      font-weight: 700;
      color: var(--admin-text-muted);
      text-transform: uppercase;
      padding: 8px 16px 4px;
      letter-spacing: 0.5px;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      text-align: left;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--admin-text-secondary);
      cursor: pointer;
      border-left: 3px solid transparent;
    }

    .drawer-item:hover {
      background: var(--admin-surface-alt);
      color: var(--admin-text-main);
    }

    .drawer-item.active {
      background: var(--admin-primary-light);
      color: var(--admin-primary);
      border-left-color: var(--admin-primary);
    }

    .drawer-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--admin-border);
      background: var(--admin-surface-alt);
    }

    /* Fixed Bottom App Navigation (Mobile Friendly) */
    .mobile-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-bar-height);
      background: #ffffff;
      border-top: 2px solid var(--admin-border);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
    }

    .bottom-nav-btn {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--admin-text-muted);
      cursor: pointer;
      position: relative;
    }

    .bottom-nav-btn svg {
      width: 19px;
      height: 19px;
    }

    .bottom-nav-btn.active {
      color: var(--admin-primary);
      background: var(--admin-primary-light);
      border-top: 2px solid var(--admin-primary);
    }

    .bottom-badge {
      position: absolute;
      top: 6px;
      right: 22%;
      background: var(--admin-warning);
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 4px;
      line-height: 1;
    }

    /* Main Container */
    .admin-main {
      max-width: 900px;
      margin: 12px auto 0;
      padding: 0 12px;
    }

    /* Login Section */
    .login-section-card {
      max-width: 360px;
      margin: 40px auto;
      padding: 28px 20px;
      background: #ffffff;
      border: 1px solid var(--admin-border-dark);
      text-align: center;
    }

    .login-crest {
      width: 50px;
      height: 50px;
      margin: 0 auto 12px;
      display: block;
    }

    .pin-inputs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 16px 0 14px;
    }

    .pin-digit {
      width: 44px;
      height: 48px;
      border: 1.5px solid var(--admin-border-dark);
      background: #fff;
      color: var(--admin-text-main);
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    .pin-digit:focus {
      border-color: var(--admin-primary);
    }

    /* Mobile KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-card {
      padding: 12px 14px;
      border: 1px solid var(--admin-border);
      background: #ffffff;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--admin-text-muted);
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-value {
      font-size: 24px;
      font-weight: 800;
      color: var(--admin-text-main);
      line-height: 1.1;
    }

    .kpi-sub {
      margin-top: 4px;
      font-size: 10.5px;
      color: var(--admin-text-muted);
    }

    /* Meter Cards */
    .meter-card {
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid var(--admin-border);
      background: #ffffff;
    }

    .meter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .meter-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--admin-text-main);
    }

    .meter-badge {
      font-size: 10.5px;
      padding: 2px 5px;
      font-weight: 700;
      border: 1px solid;
    }

    .meter-badge.full {
      background: var(--admin-danger-light);
      color: var(--admin-danger);
      border-color: #fecaca;
    }

    .meter-badge.open {
      background: var(--admin-accent-light);
      color: var(--admin-accent);
      border-color: #a7f3d0;
    }

    .meter-bar-track {
      width: 100%;
      height: 7px;
      background: var(--admin-surface-alt);
      border: 1px solid var(--admin-border);
      margin-bottom: 6px;
    }

    .meter-bar-fill {
      height: 100%;
    }

    /* Duplicates */
    .dupe-card {
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--admin-border);
      border-left: 4px solid var(--admin-warning);
      background: #ffffff;
    }

    .dupe-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .dupe-roles-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .dupe-role-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: var(--admin-surface-alt);
      border: 1px solid var(--admin-border);
      font-size: 12.5px;
    }

    /* Settings */
    .settings-section {
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid var(--admin-border);
      background: #ffffff;
    }

    .settings-section-title {
      font-size: 14.5px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .settings-section-desc {
      font-size: 11.5px;
      color: var(--admin-text-muted);
      margin-bottom: 12px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--admin-border);
      gap: 10px;
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-info h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .setting-info p {
      font-size: 11px;
      color: var(--admin-text-muted);
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      border: 1px solid var(--admin-border-dark);
      transition: .15s ease;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #fff;
      transition: .15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    input:checked + .slider {
      background-color: var(--admin-accent);
      border-color: #059669;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Table Style */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--admin-border);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
      background: #ffffff;
    }

    .admin-table th {
      background: var(--admin-surface-alt);
      padding: 8px 10px;
      color: var(--admin-text-main);
      font-weight: 700;
      border-bottom: 2px solid var(--admin-border);
      white-space: nowrap;
    }

    .admin-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--admin-border);
      color: var(--admin-text-secondary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--admin-primary);
      color: #fff;
      border-color: var(--admin-primary-hover);
    }

    .btn-ghost {
      background: #fff;
      color: var(--admin-text-secondary);
      border: 1px solid var(--admin-border-dark);
    }

    .btn-danger {
      background: var(--admin-danger-light);
      color: var(--admin-danger);
      border: 1px solid #fecaca;
    }

    .btn-success {
      background: var(--admin-accent-light);
      color: var(--admin-accent);
      border: 1px solid #a7f3d0;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-content {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px;
      background: #fff;
      border: 1px solid var(--admin-border-dark);
    }
  </style>

</head>
