<!DOCTYPE html>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/images/school_crest.png">
  <link rel="apple-touch-icon" href="../assets/images/school_crest.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/attendance.css?v=2" />

  <!-- Scripts -->
  <script defer src="js/config.js?v=2"></script>
  <script defer src="js/api.js?v=2"></script>
  <script defer src="js/store.js?v=2"></script>
  <script defer src="js/app.js?v=2"></script>
</head>
<body>
  <!-- DESKTOP / MOBILE TOP HEADER -->
  <header class="nav">
    <div class="nav-inner">
      <div class="nav-left">
        <div class="brand">
          <span class="brand-dot"></span>
          อยุธยาสีชมพู 2569

      <!-- Desktop Navigation Tabs -->
      <nav class="desktop-tabs" aria-label="เมนูหลักเดสก์ท็อป">
        <button class="tab active" data-view="home" onclick="AttendanceApp.navigate('home')">หน้าแรก</button>
        <button class="tab" data-view="register" onclick="AttendanceApp.navigate('register')">ลงทะเบียน</button>
        <button class="tab" data-view="classes" onclick="AttendanceApp.navigate('classes')">ดูตามห้อง</button>
        <button class="tab" data-view="departments" onclick="AttendanceApp.navigate('departments')">ดูตามฝ่าย</button>
      </nav>

      <!-- Refresh Button -->
      <div>
        <button class="btn-refresh" id="refreshBtn" onclick="AttendanceApp.refreshData()" title="รีเฟรชข้อมูลสด">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>

  <main id="view-container">

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <nav class="mobile-bottom-nav" aria-label="เมนูหลักโทรศัพท์มือถือ">
    <div class="mobile-nav-grid">
      <button type="button" class="mobile-nav-item active" data-mobile-view="home" onclick="AttendanceApp.navigate('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>หน้าแรก</span>
      </button>

      <button type="button" class="mobile-nav-item" data-mobile-view="register" onclick="AttendanceApp.navigate('register')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <span>ลงทะเบียน</span>
      </button>

      <button type="button" class="mobile-nav-item" data-mobile-view="classes" onclick="AttendanceApp.navigate('classes')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>ดูตามห้อง</span>
      </button>

      <button type="button" class="mobile-nav-item" data-mobile-view="departments" onclick="AttendanceApp.navigate('departments')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
        <span>ดูตามฝ่าย</span>
      </button>
    </div>

  <!-- FOOTER -->
  <footer>
    <div class="wrap">
      อยุธยาสีชมพู ปี 2569 · ระบบจัดสรรบทบาทคณะสี สารคามพิทยาคม

  </footer>

</html>
